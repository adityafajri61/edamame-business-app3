<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edamame Fresh - Sistem Manajemen Bisnis V1</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
        }
        .thermal-receipt {
            font-family: 'Courier New', Courier, monospace;
            width: 300px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            color: #000;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden text-slate-800">

    <!-- TOP NAVIGATION HEADER -->
    <header class="bg-slate-900 text-white h-16 flex items-center justify-between px-4 sm:px-6 shadow-md z-30 flex-shrink-0 no-print">
        <div class="flex items-center space-x-3">
            <button id="sidebarToggleBtn" onclick="toggleSidebar()" class="lg:hidden text-slate-300 hover:text-white p-2 rounded-lg focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-lg bg-brand-500 flex items-center justify-center text-slate-900 font-bold text-xl shadow-inner">
                    <i class="fa-solid fa-seedling text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight tracking-wide text-brand-100">EDAMAME FRESH</h1>
                    <p class="text-[10px] text-brand-500 font-medium tracking-wider uppercase">Business Management V1</p>
                </div>
            </div>
        </div>

        <!-- Global Search Bar -->
        <div class="hidden md:flex items-center flex-1 max-w-md mx-8 relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 text-slate-400 text-sm"></i>
            <input type="text" id="globalSearchInput" placeholder="Cari pelanggan, invoice (INV-...), order, WA..." class="w-full bg-slate-800 text-slate-200 text-sm pl-9 pr-4 py-1.5 rounded-lg border border-slate-700 focus:outline-none focus:border-brand-500 transition">
        </div>

        <!-- Header Controls & User Info -->
        <div class="flex items-center space-x-3 sm:space-x-4">
            <!-- TOMBOL KONEKSI GOOGLE SHEETS -->
            <button onclick="openConfigModal()" class="flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-emerald-400 text-xs font-semibold px-3 py-2 rounded-lg transition shadow">
                <i class="fa-solid fa-plug"></i>
                <span class="hidden sm:inline">Integrasi Apps Script</span>
            </button>

            <button onclick="navigateTo('buat-order')" class="hidden sm:flex items-center space-x-1.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-3 py-2 rounded-lg transition shadow">
                <i class="fa-solid fa-plus"></i>
                <span>Order Baru</span>
            </button>

            <div class="flex items-center space-x-1.5 bg-slate-800 px-2.5 py-1 rounded-lg border border-slate-700 text-xs">
                <span class="text-slate-400 hidden xl:inline">Role:</span>
                <select id="userRoleSelect" onchange="changeRole(this.value)" class="bg-transparent text-slate-200 font-semibold focus:outline-none cursor-pointer">
                    <option value="ADMIN" class="bg-slate-900">ADMIN (Akses Penuh)</option>
                    <option value="STAFF" class="bg-slate-900">STAFF (Operasional)</option>
                    <option value="VIEWER" class="bg-slate-900">VIEWER (Laporan)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- MAIN WRAPPER WITH SIDEBAR & CONTENT -->
    <div class="flex flex-1 overflow-hidden relative">
        <!-- SIDEBAR NAVIGATION -->
        <aside id="sidebarNav" class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 transition-all duration-300 z-20 absolute lg:relative inset-y-0 left-0 -translate-x-full lg:translate-x-0 no-print border-r border-slate-800">
            <nav class="flex-1 overflow-y-auto py-3 px-3 space-y-1 text-sm font-medium">
                <a href="#" onclick="navigateTo('dashboard')" class="flex items-center px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-pie w-6 text-slate-400"></i>
                    <span>DASHBOARD</span>
                </a>
                <div class="pt-2 pb-1 px-3 text-[10px] font-bold tracking-wider text-slate-500 uppercase">Penjualan & Pelanggan</div>
                <a href="#" onclick="navigateTo('order')" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <div class="flex items-center">
                        <i class="fa-solid fa-cart-shopping w-6 text-slate-400"></i>
                        <span>Order</span>
                    </div>
                </a>
                <a href="#" onclick="navigateTo('buat-order')" class="flex items-center px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition pl-8">
                    <i class="fa-solid fa-circle-plus w-5 text-slate-400 text-xs"></i>
                    <span>Buat Order</span>
                </a>
                <a href="#" onclick="navigateTo('pelanggan')" class="flex items-center px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-users w-6 text-slate-400"></i>
                    <span>PELANGGAN</span>
                </a>
                <div class="pt-2 pb-1 px-3 text-[10px] font-bold tracking-wider text-slate-500 uppercase">Keuangan & Tagihan</div>
                <a href="#" onclick="navigateTo('invoice')" class="flex items-center px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-file-invoice-dollar w-6 text-slate-400"></i>
                    <span>INVOICE</span>
                </a>
                <a href="#" onclick="navigateTo('stok')" class="flex items-center justify-between px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition">
                    <div class="flex items-center">
                        <i class="fa-solid fa-warehouse w-6 text-slate-400"></i>
                        <span>STOK</span>
                    </div>
                </a>
                <!-- Pengaturan Tambahan -->
                <div class="pt-2 pb-1 px-3 text-[10px] font-bold tracking-wider text-slate-500 uppercase">Pengaturan Integrasi</div>
                <a href="#" onclick="openConfigModal()" class="flex items-center px-3 py-2.5 rounded-lg text-emerald-400 hover:bg-slate-800 transition">
                    <i class="fa-solid fa-gear w-6"></i>
                    <span>API & Google Sheets</span>
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 overflow-y-auto bg-slate-100 p-4 sm:p-6 lg:p-8 relative">
            <div id="contentContainer" class="max-w-7xl mx-auto space-y-6"></div>
        </main>
    </div>

    <!-- MODAL CONTAINER -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden no-print">
        <div id="modalCard" class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div id="modalHeader" class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 id="modalTitle" class="font-bold text-slate-800 text-base sm:text-lg">Modal Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto flex-1 text-sm text-slate-700"></div>
            <div id="modalFooter" class="px-6 py-3 border-t border-slate-100 flex justify-end space-x-2 bg-slate-50"></div>
        </div>
    </div>

    <!-- APPLICATION ENGINE SCRIPT -->
    <script>
        const DB_KEY = 'EDAMAME_BIZ_DB_V1';

        const initialDB = {
            config: {
                webAppUrl: '',
                spreadsheetId: ''
            },
            userRole: 'ADMIN',
            products: [
                { id: 'PROD-001', product_code: 'EDM-01', name: 'Edamame Fresh Premium', unit: 'Karung', kg_per_sack: 30, purchase_price: 18000, selling_price: 25000, minimum_stock_kg: 500, status: 'Aktif', created_at: '2026-08-01' }
            ],
            customers: [
                { id: 'CUST-001', customer_code: 'CST-001', name: 'Budi Santoso', company_name: 'Toko Segar Frozen', whatsapp: '081234567890', phone: '081234567890', address: 'Jl. Raya Pasar Induk No. 45', city: 'Surabaya', province: 'Jawa Timur', customer_type: 'Frozen Food', payment_term_days: 7, credit_limit: 15000000, status: 'Aktif', notes: 'Pelanggan rutin freezer room', created_at: '2026-08-10' }
            ],
            inventory: {
                current_sack: 40,
                current_kg: 1200,
                transactions: []
            },
            orders: [
                { id: 'ORD-2026-0001', order_number: 'ORD-2026-0001', date: '2026-08-28', customer_id: 'CUST-001', product_id: 'PROD-001', sacks: 10, kg: 300, ton: 0.3, unit_price: 25000, discount: 0, shipping_cost: 50000, subtotal: 7500000, grand_total: 7550000, payment_term_days: 7, due_date: '2026-09-04', shipping_destination: 'Jl. Raya Pasar Induk No. 45, Surabaya', order_status: 'Dikirim', payment_status: 'DIBAYAR SEBAGIAN', notes: 'Kirim pagi via L300' }
            ],
            invoices: [
                { id: 'INV-2026-0001', invoice_number: 'INV-2026-0001', order_id: 'ORD-2026-0001', customer_id: 'CUST-001', date: '2026-08-28', due_date: '2026-09-04', total_amount: 7550000, paid_amount: 3000000, remaining_piutang: 4550000, status: 'DIBAYAR SEBAGIAN' }
            ]
        };

        let db = loadDatabase();

        function loadDatabase() {
            const saved = localStorage.getItem(DB_KEY);
            if (saved) {
                try { 
                    const parsed = JSON.parse(saved);
                    if (!parsed.config) parsed.config = { webAppUrl: '', spreadsheetId: '' };
                    return parsed; 
                } catch(e) {}
            }
            saveDatabase(initialDB);
            return initialDB;
        }

        function saveDatabase(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); }
        function formatRupiah(num) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0); }
        function formatNumber(num) { return new Intl.NumberFormat('id-ID').format(num || 0); }
        function getTodayString() { return new Date().toISOString().split('T')[0]; }
        function toggleSidebar() { document.getElementById('sidebarNav').classList.toggle('-translate-x-full'); }

        // --- MODAL INPUT INTEGRASI DEPLOYMENT & SPREADSHEET ---
        function openConfigModal() {
            const bodyHtml = `
                <div class="space-y-4">
                    <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-lg text-xs text-emerald-800">
                        <i class="fa-solid fa-circle-info mr-1"></i>
                        Masukkan <strong>URL Deployment Apps Script</strong> dan <strong>ID Spreadsheet</strong> agar aplikasi web ini terhubung langsung ke Google Sheets milikmu.
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Web App Deployment URL</label>
                        <input type="text" id="configWebAppUrl" value="${db.config?.webAppUrl || ''}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-brand-500 font-mono">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Google Spreadsheet ID (atau Link URL)</label>
                        <input type="text" id="configSpreadsheetId" value="${db.config?.spreadsheetId || ''}" placeholder="1BxiMVs0XRA5nFMdRpB..." class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-brand-500 font-mono">
                    </div>
                </div>
            `;

            const footerHtml = `
                <button onclick="closeModal()" class="px-3 py-1.5 text-xs text-slate-600 font-semibold hover:bg-slate-200 rounded-lg">Batal</button>
                <button onclick="saveConfig()" class="px-4 py-1.5 text-xs bg-brand-600 hover:bg-brand-500 text-white font-bold rounded-lg shadow">Simpan & Terapkan</button>
            `;

            openModal('Integrasi Google Apps Script & Sheets', bodyHtml, footerHtml);
        }

        function saveConfig() {
            const url = document.getElementById('configWebAppUrl').value.trim();
            const sheetId = document.getElementById('configSpreadsheetId').value.trim();

            db.config = {
                webAppUrl: url,
                spreadsheetId: sheetId
            };

            saveDatabase(db);
            alert('Konfigurasi integrasi berhasil disimpan!');
            closeModal();
        }

        function navigateTo(view) {
            const container = document.getElementById('contentContainer');
            if (view === 'dashboard') { container.innerHTML = renderDashboard(); initDashboardChart(); }
            else if (view === 'order') { container.innerHTML = renderOrdersView(); }
            else if (view === 'buat-order') { container.innerHTML = renderCreateOrderForm(); calculateOrderTotals(); }
            else if (view === 'pelanggan') { container.innerHTML = renderCustomersView(); }
            else if (view === 'invoice') { container.innerHTML = renderInvoicesView(); }
            else if (view === 'stok') { container.innerHTML = renderStockView(); }
        }

        function renderDashboard() {
            return `
                <div class="space-y-6">
                    <div class="flex justify-between items-center border-b pb-4">
                        <div><h2 class="text-2xl font-bold">Dashboard Bisnis Edamame</h2><p class="text-xs text-slate-500">Ringkasan performa operasional & stok</p></div>
                    </div>
                    <div class="bg-slate-900 text-white rounded-xl p-6 shadow-md flex justify-between items-center">
                        <div>
                            <span class="text-xs bg-brand-600 px-2 py-0.5 rounded font-bold">STOK SAAT INI</span>
                            <div class="text-3xl font-extrabold mt-2">${formatNumber(db.inventory.current_sack)} <span class="text-lg">Karung</span> / ${formatNumber(db.inventory.current_kg)} Kg</div>
                        </div>
                    </div>
                    <div class="bg-white p-5 rounded-xl border shadow-sm relative h-64">
                        <canvas id="dashboardSalesChart"></canvas>
                    </div>
                </div>
            `;
        }

        function initDashboardChart() {
            const ctx = document.getElementById('dashboardSalesChart');
            if (!ctx) return;
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'],
                    datasets: [{ label: 'Sales (Rp)', data: [1200000, 1900000, 3000000, 500000, 2000000, 7550000, 4000000], backgroundColor: '#22c55e' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderOrdersView() {
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-xl font-bold">Daftar Order Penjualan</h2>
                        <button onclick="navigateTo('buat-order')" class="bg-brand-600 text-white px-3 py-2 rounded-lg text-xs font-bold">+ Buat Order</button>
                    </div>
                    <div class="bg-white rounded-xl border shadow-sm overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-50 font-bold border-b">
                                <tr><th class="p-3">No Order</th><th class="p-3">Pelanggan</th><th class="p-3">Volume</th><th class="p-3">Total</th><th class="p-3">Status</th></tr>
                            </thead>
                            <tbody>
                                ${db.orders.map(o => `
                                    <tr class="border-b">
                                        <td class="p-3 font-bold">${o.order_number}</td>
                                        <td class="p-3">${o.customer_id}</td>
                                        <td class="p-3">${o.sacks} Sack (${o.kg} Kg)</td>
                                        <td class="p-3 font-bold">${formatRupiah(o.grand_total)}</td>
                                        <td class="p-3"><span class="px-2 py-0.5 rounded bg-brand-100 text-brand-800 font-bold">${o.order_status}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderCreateOrderForm() {
            const nextOrderNo = 'ORD-2026-' + String(db.orders.length + 1).padStart(4, '0');
            return `
                <form onsubmit="handleSaveOrder(event)" class="bg-white p-6 rounded-xl border shadow-sm space-y-4 max-w-2xl mx-auto">
                    <h2 class="text-lg font-bold">Buat Order Penjualan</h2>
                    <div><label class="block text-xs font-bold">No Order</label><input type="text" id="formOrderNo" value="${nextOrderNo}" readonly class="w-full bg-slate-100 p-2 text-xs border rounded font-bold"></div>
                    <div>
                        <label class="block text-xs font-bold">Pelanggan</label>
                        <select id="formOrderCustomer" required class="w-full p-2 text-xs border rounded">
                            ${db.customers.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold">Jumlah Karung (1 Karung = 30 Kg)</label>
                        <input type="number" id="formOrderSack" value="10" oninput="calculateOrderTotals()" required class="w-full p-2 text-xs border rounded font-bold">
                    </div>
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded border text-xs font-bold">
                        <span>Konversi Berat: <span id="formDisplayKg">300 Kg</span> (<span id="formDisplayTon">0.3 Ton</span>)</span>
                        <span>Grand Total: <span id="orderGrandTotalDisplay" class="text-brand-600 font-extrabold text-sm">Rp0</span></span>
                    </div>
                    <button type="submit" class="w-full py-2 bg-brand-600 text-white rounded font-bold text-xs">Simpan Transaksi</button>
                </form>
            `;
        }

        function calculateOrderTotals() {
            const sack = parseFloat(document.getElementById('formOrderSack')?.value) || 0;
            const kg = sack * 30;
            const ton = (kg / 1000).toFixed(2);
            const total = kg * 25000;
            if (document.getElementById('formDisplayKg')) document.getElementById('formDisplayKg').innerText = `${kg} Kg`;
            if (document.getElementById('formDisplayTon')) document.getElementById('formDisplayTon').innerText = `${ton} Ton`;
            if (document.getElementById('orderGrandTotalDisplay')) document.getElementById('orderGrandTotalDisplay').innerText = formatRupiah(total);
        }

        function handleSaveOrder(e) {
            e.preventDefault();
            const sack = parseFloat(document.getElementById('formOrderSack').value) || 0;
            const kg = sack * 30;
            const total = kg * 25000;
            const orderNo = document.getElementById('formOrderNo').value;
            const custId = document.getElementById('formOrderCustomer').value;

            const newOrder = {
                id: orderNo,
                order_number: orderNo,
                date: getTodayString(),
                customer_id: custId,
                sacks: sack,
                kg: kg,
                ton: (kg / 1000).toFixed(2),
                grand_total: total,
                order_status: 'Dikirim'
            };

            db.orders.unshift(newOrder);
            db.inventory.current_sack -= sack;
            db.inventory.current_kg -= kg;
            saveDatabase(db);

            // Opsional: Kirim data ke Google Sheets jika URL deployment telah diisi
            if (db.config?.webAppUrl) {
                fetch(db.config.webAppUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newOrder)
                }).catch(err => console.log('Spreadsheet Sync Error:', err));
            }

            navigateTo('order');
        }

        function renderCustomersView() {
            return `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold">Pelanggan</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${db.customers.map(c => `
                            <div class="bg-white p-4 rounded-xl border shadow-sm text-xs">
                                <h3 class="font-bold text-base">${c.name}</h3>
                                <p class="text-slate-500">${c.company_name}</p>
                                <p class="mt-2">WA: ${c.whatsapp}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderInvoicesView() {
            return `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold">Invoices</h2>
                    <div class="bg-white rounded-xl border shadow-sm p-4 text-xs">
                        ${db.invoices.map(i => `
                            <div class="flex justify-between items-center border-b py-2">
                                <div><p class="font-bold">${i.invoice_number}</p><p class="text-slate-400">Order: ${i.order_id}</p></div>
                                <span class="font-extrabold text-brand-600">${formatRupiah(i.total_amount)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderStockView() {
            return `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold">Manajemen Stok Gudang</h2>
                    <div class="bg-white p-6 rounded-xl border shadow-sm text-center">
                        <p class="text-xs text-slate-500">Stok Tersedia</p>
                        <h3 class="text-3xl font-extrabold text-slate-800">${db.inventory.current_sack} Sack (${db.inventory.current_kg} Kg)</h3>
                    </div>
                </div>
            `;
        }

        function openModal(title, bodyHtml, footerHtml = '') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = bodyHtml;
            document.getElementById('modalFooter').innerHTML = footerHtml;
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

        // Initialize App
        navigateTo('dashboard');
    </script>
</body>
</html>
